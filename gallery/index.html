<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/Icons/ML-Logo.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ML Howell — Projects</title>
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=Inter:opsz,wght@14..32,100..900&family=Inter+Display:wght@100..900&display=swap" rel="stylesheet">
  <script defer src="/_vercel/insights/script.js"></script>
  <style>
    /* Standalone gallery-night page: same type and tokens as the
       portfolio, but no site nav/footer so nobody wanders off.
       Projects drift sideways in an endless row; the card in the
       middle is biggest and sharpest, the edges shrink and blur. */
    :root {
      --color-text:   #1A1A1A;
      --color-grey:   #A2A2A2;
      --color-accent: #C8341A;
      --gap: 24px;
      --w: 480px;            /* centre card width, set by JS */
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #FFFFFF; color: var(--color-text); }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 32px 0 24px;
      overflow-x: hidden;
    }

    /* ── Header: one ~600px row — name · handle + QR · year ── */
    header {
      width: min(600px, calc(100% - 32px));
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    /* Name, handle and year all share the project-title style. */
    .name, .x-handle, .year {
      font-weight: 500;
      font-size: 14px;
      line-height: 16px;
      letter-spacing: -0.1px;
      white-space: nowrap;
    }
    .x {
      display: flex;
      align-items: center;
      gap: 10px;
      color: inherit;
      text-decoration: none;
    }
    .x-qr { width: 32px; height: 32px; display: block; }
    .x-handle { transition: color 0.15s; }
    .x:hover .x-handle { color: var(--color-accent); }

    /* ── Drifting row ─────────────────────────────────── */
    .stage {
      flex: 1;
      position: relative;
      min-height: 360px;
      overflow: hidden;
      touch-action: pan-y;          /* horizontal swipes drive the row */
      user-select: none;
      -webkit-user-select: none;
      animation: slideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
    }
    /* Without JS: a plain scrollable row. */
    .track {
      display: flex;
      gap: var(--gap);
      height: 100%;
      align-items: center;
      overflow-x: auto;
      padding: 0 24px;
    }
    .card {
      flex: none;
      width: var(--w);
      display: flex;
      flex-direction: column;
      color: inherit;
      text-decoration: none;
      -webkit-user-drag: none;
    }
    /* With JS: every card is placed absolutely around the centre. */
    .stage.is-live .track { display: block; overflow: visible; padding: 0; }
    .stage.is-live .card {
      position: absolute;
      left: 50%;
      top: 50%;
      will-change: transform, filter, opacity;
    }
    .stage.is-dragging { cursor: grabbing; }

    .thumb {
      aspect-ratio: 16 / 9;
      background: rgba(0,0,0,0.06);
      overflow: hidden;
      position: relative;
    }
    .thumb.has-edge { border: 1px solid rgba(0,0,0,0.10); }
    .thumb img, .thumb video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      -webkit-user-drag: none;
    }
    .meta {
      padding-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
    }
    .title {
      font-weight: 500;
      font-size: 14px;
      line-height: 16px;
      letter-spacing: -0.1px;
      white-space: nowrap;
      transition: color 0.15s;
    }
    .card:hover .title { color: var(--color-accent); }
    .desc {
      font-size: 14px;
      line-height: 16px;
      letter-spacing: -0.2px;
      color: var(--color-grey);
      text-align: right;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .stage { animation: none; }
    }

    @media (max-width: 699px) {
      body { padding: 24px 0 24px; }
      .meta { flex-direction: column; gap: 4px; }
      .desc { text-align: left; }
    }
  </style>
</head>
<body>

  <header>
    <h1 class="name">ML Howell</h1>
    <a class="x" href="https://x.com/marlouiise" target="_blank" rel="noopener"><span class="x-handle">@marlouiise</span></a>
    <a class="x" href="https://x.com/marlouiise" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true"><img class="x-qr" src="/gallery/x-qr.svg" alt=""></a>
    <span class="year">2026</span>
  </header>

  <main class="stage">
    <div class="track">
      <a class="card" href="/projects/pick-n-mix/?from=gallery" draggable="false">
        <div class="thumb has-edge">
          <img src="/experiments/images/pick-n-mix.webp?v=2" alt="Pick N Mix grid of Swedish candies" draggable="false">
        </div>
        <div class="meta">
          <span class="title">Pick n mix</span>
          <span class="desc">A short history of Swedish candy</span>
        </div>
      </a>

      <a class="card" href="/projects/designers-that-read/?from=gallery" draggable="false">
        <div class="thumb">
          <img src="/gallery/designers-that-read.jpg" alt="Painting of a woman reading a book in a field under a stormy sky" style="object-fit:cover;object-position:center bottom" draggable="false">
        </div>
        <div class="meta">
          <span class="title">Designers that read</span>
          <span class="desc">Monthly book club for designers in SF</span>
        </div>
      </a>

      <a class="card" href="/projects/doodles/?from=gallery" draggable="false">
        <div class="thumb">
          <video autoplay muted loop playsinline preload="auto" aria-label="Doodles preview">
            <source src="/projects/doodles/thumb.mp4" type="video/mp4">
          </video>
        </div>
        <div class="meta">
          <span class="title">Doodles</span>
          <span class="desc">Line-art doodles on an endless canvas</span>
        </div>
      </a>

      <a class="card" href="/projects/travels/?from=gallery" draggable="false">
        <div class="thumb">
          <video autoplay muted loop playsinline preload="auto" aria-label="Travels preview">
            <source src="/projects/Travel/thumb.mp4?v=6" type="video/mp4">
          </video>
        </div>
        <div class="meta">
          <span class="title">Travels</span>
          <span class="desc">A deck of cards from photos on my travels</span>
        </div>
      </a>
    </div>
  </main>

<script>
(function () {
  /* ── Tuning ───────────────────────────────────────── */
  var SHRINK = 0.2;            // scale lost per card away from centre
  var MIN_SCALE = 0.55;        // edge cards bottom out here
  var BLUR_START = 1.1;        // cards from centre before blur kicks in
  var BLUR_PER_CARD = 4;       // px of blur per card beyond that
  var MAX_BLUR = 12;
  var COPIES = 3;              // the 4 projects repeat this many times

  var stage = document.querySelector('.stage');
  var track = stage.querySelector('.track');
  var originals = Array.prototype.slice.call(track.children);

  // Repeat the set so the loop never shows a gap. Clones are hidden
  // from screen readers and keyboard focus.
  for (var c = 1; c < COPIES; c++) {
    originals.forEach(function (card) {
      var clone = card.cloneNode(true);
      clone.setAttribute('aria-hidden', 'true');
      clone.tabIndex = -1;
      track.appendChild(clone);
    });
  }
  var cards = Array.prototype.slice.call(track.children);
  var videos = cards.map(function (card) {
    var v = card.querySelector('video');
    if (v) { v.muted = true; }
    return v;
  });
  var K = cards.length;
  stage.classList.add('is-live');

  var gap = 24, W = 480;

  function measure() {
    var vw = window.innerWidth;
    var room = stage.clientHeight - 72;               // leave space for labels
    var byWidth = vw < 700 ? vw * 0.72 : vw * 0.34;
    W = Math.max(200, Math.min(byWidth, room * 16 / 9));
    gap = vw < 700 ? 16 : 24;
    stage.style.setProperty('--w', W + 'px');
  }

  // Scale for a card `v` cards from centre.
  function scaleAt(v) { return Math.max(MIN_SCALE, 1 - SHRINK * Math.abs(v)); }

  // Horizontal offset of a card's centre. Integrating the (shrinking)
  // card width keeps the gap between neighbours constant.
  var U0 = (1 - MIN_SCALE) / SHRINK;
  function offsetAt(v) {
    var a = Math.abs(v), d;
    if (a <= U0) d = (W + gap) * a - W * SHRINK * a * a / 2;
    else d = (W + gap) * U0 - W * SHRINK * U0 * U0 / 2 + (W * MIN_SCALE + gap) * (a - U0);
    return v < 0 ? -d : d;
  }

  var p = 0;                                           // position, in cards
  var dragging = false;

  function render() {
    var half = window.innerWidth / 2;
    for (var k = 0; k < K; k++) {
      var v = ((k - p) % K + K) % K;
      if (v >= K / 2) v -= K;
      var a = Math.abs(v);
      var x = offsetAt(v);
      var s = scaleAt(v);
      var blur = Math.min(MAX_BLUR, Math.max(0, a - BLUR_START) * BLUR_PER_CARD);
      var fade = 1 - 0.45 * Math.min(1, Math.max(0, (a - 1) / 2));
      var el = cards[k];
      el.style.transform = 'translate(-50%, -50%) translateX(' + x.toFixed(1) + 'px) scale(' + s.toFixed(4) + ')';
      el.style.filter = blur > 0.05 ? 'blur(' + blur.toFixed(2) + 'px)' : 'none';
      el.style.opacity = fade.toFixed(3);
      el.style.zIndex = String(100 - Math.round(a * 10));

      // Only play videos that are on screen.
      var vid = videos[k];
      if (vid) {
        var onScreen = Math.abs(x) < half + W;
        if (onScreen && vid.paused) { var pr = vid.play(); if (pr && pr.catch) pr.catch(function () {}); }
        else if (!onScreen && !vid.paused) vid.pause();
      }
    }
  }

  // No auto-drift: the row only moves when you scroll, drag or swipe.
  var pending = false;
  function requestRender() {
    if (pending) return;
    pending = true;
    requestAnimationFrame(function () { pending = false; render(); });
  }

  // ── Scroll: trackpad sideways swipes, or a mouse wheel ──
  // The page itself never scrolls, so whichever axis is bigger moves
  // the row. preventDefault stops the browser's back/forward swipe.
  window.addEventListener('wheel', function (e) {
    var d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (e.deltaMode === 1) d *= 16;                    // lines → px
    e.preventDefault();
    p += d / (W + gap);
    requestRender();
  }, { passive: false });

  // ── Drag / swipe ──
  var startX = 0, startP = 0, moved = false, activeId = null;
  stage.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    activeId = e.pointerId; startX = e.clientX; startP = p; moved = false; dragging = true;
  });
  window.addEventListener('pointermove', function (e) {
    if (!dragging || e.pointerId !== activeId) return;
    var dx = e.clientX - startX;
    if (Math.abs(dx) > 5) { moved = true; stage.classList.add('is-dragging'); }
    p = startP - dx / (W + gap);
    requestRender();
  });
  function endDrag(e) {
    if (!dragging || e.pointerId !== activeId) return;
    dragging = false; activeId = null;
    stage.classList.remove('is-dragging');
  }
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);
  // A drag shouldn't count as a click on the card under it.
  stage.addEventListener('click', function (e) {
    if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; }
  }, true);

  measure();
  window.addEventListener('resize', function () { measure(); requestRender(); });
  render();
})();
</script>

</body>
</html>

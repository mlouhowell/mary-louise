<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ML Howell — Homepage intro test</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/retro-windows.css?v=13">
  <style>
    /* ── GT Mechanik (Trial) ─────────────────────────── */
    @font-face {
      font-family: 'GT Mechanik Poly';
      src: url('fonts/GT-Mechanik/GT-Mechanik-Poly-Regular-Trial.woff2') format('woff2');
      font-weight: 400;
    }
    @font-face {
      font-family: 'GT Mechanik Poly';
      src: url('fonts/GT-Mechanik/GT-Mechanik-Poly-Medium-Trial.woff2') format('woff2');
      font-weight: 500;
    }
    @font-face {
      font-family: 'GT Mechanik Mono';
      src: url('fonts/GT-Mechanik/GT-Mechanik-Mono-Regular-Trial.woff2') format('woff2');
      font-weight: 400;
    }
    @font-face {
      font-family: 'GT Mechanik Mono';
      src: url('fonts/GT-Mechanik/GT-Mechanik-Mono-Medium-Trial.woff2') format('woff2');
      font-weight: 500;
    }

    :root {
      --periwinkle: #7395E7;
      --olive:      #949B37;
      --paper:      #F7F5F0;
      --ink:        #141414;
      --accent:     #7395E7;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'GT Mechanik Poly', system-ui, sans-serif;
      background: var(--paper);
      overflow: hidden;
      height: 100vh;
    }

    /* ── Nav (always visible, white strip) ───────────── */
    .site-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 44px;
      background: var(--paper);
      border-bottom: 1px solid rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 100;
      font-family: 'GT Mechanik Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(0,0,0,0.55);
    }
    .site-nav a { color: inherit; text-decoration: none; }
    .site-nav .links { display: flex; gap: 28px; }

    /* ── Stage (bg color animates) ───────────────────── */
    #stage {
      position: fixed;
      inset: 44px 0 0 0;
      background: var(--periwinkle);
      transition: background 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #stage.olive { background: var(--olive); }
    #stage.paper { background: var(--paper); transition-duration: 0.9s; }

    #ascii {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      transition: opacity 0.6s ease;
    }
    #ascii.gone { opacity: 0; }

    /* ── Retro windows: center the stage, GT Mechanik text ── */
    .retro-windows {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0;
    }

    /* Name window: train-board ticker (typed → hold → scroll off) */
    .retro-body--name { padding: 16px; }
    .retro-name-clip {
      overflow: hidden;
      height: 1.2em;
      font-size: 30px;
    }
    .retro-name {
      font-family: 'GT Mechanik Poly', sans-serif;
      font-weight: 400;
      font-size: 30px;
      line-height: 1.15;
      letter-spacing: -0.01em;
      color: #000;
      white-space: nowrap;
      display: inline-block;
      will-change: transform;
    }

    /* Bio + accents in GT Mechanik */
    .retro-bio {
      font-family: 'GT Mechanik Poly', sans-serif;
    }
    .retro-bio .m {
      font-family: 'GT Mechanik Mono', monospace;
      color: var(--accent);
    }

    /* char-by-char typing: chars start hidden */
    .retro-bio .ch { visibility: hidden; }
    .retro-bio.typed .ch { visibility: visible; }

    .retro-body--sun canvas { display: block; }

    /* ── Footer (per design system) ──────────────────── */
    footer {
      position: fixed;
      bottom: 16px; left: 20px;
      z-index: 300;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      line-height: 1;
      color: #000;
    }
    footer a { color: inherit; text-decoration: none; }

    #hint {
      position: fixed;
      bottom: 16px; right: 20px;
      z-index: 300;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: rgba(0,0,0,0.45);
    }
  </style>
</head>
<body>

  <header class="site-nav">
    <a href="/">ML Howell</a>
    <nav class="links">
      <a href="/">Work</a>
      <a href="/about/">About</a>
      <a href="/experiments/">Experiments</a>
    </nav>
  </header>

  <div id="stage">
    <canvas id="ascii"></canvas>

    <!-- Retro windows — same structure/chrome as index.html -->
    <section class="retro-windows" id="retro-windows" aria-label="Intro">
      <div class="retro-stage" id="retro-stage">

        <!-- Name window (ticker) -->
        <div class="retro-window" data-window style="left: 100px; top: 118px; width: 470px; z-index: 2;">
          <div class="retro-titlebar" data-drag-handle>
            <button class="retro-close" type="button" aria-label="Close window">&#10005;</button>
            <span class="retro-lines" aria-hidden="true"></span>
          </div>
          <div class="retro-body retro-body--name">
            <div class="retro-name-clip"><div class="retro-name" id="name-track">Mary-Louise or ML for short</div></div>
          </div>
        </div>

        <!-- Bio window -->
        <div class="retro-window retro-window--bio" data-window style="left: 160px; top: 200px; z-index: 1;">
          <div class="retro-titlebar" data-drag-handle>
            <button class="retro-close" type="button" aria-label="Close window">&#10005;</button>
            <span class="retro-lines" aria-hidden="true"></span>
          </div>
          <div class="retro-body">
            <p class="retro-bio" data-type-rich>is a product designer with a love for <span class="m">building.</span> She has equal interest in designing <span class="m">creative tools</span> and products focused on making <span class="m">humans healthier.</span></p>
          </div>
        </div>

        <!-- Mini sun window -->
        <div class="retro-window retro-window--sun" data-window style="left: 620px; top: 250px; width: 200px; z-index: 4;">
          <div class="retro-titlebar" data-drag-handle>
            <button class="retro-close" type="button" aria-label="Close window">&#10005;</button>
            <span class="retro-lines" aria-hidden="true"></span>
          </div>
          <div class="retro-body retro-body--sun">
            <canvas id="mini-sun"></canvas>
          </div>
        </div>

      </div>
    </section>
  </div>

  <footer><a href="https://mary-louise.com">By ML Howell</a> · V1.1 · July 2026</footer>
  <div id="hint">click to skip · R to replay</div>

  <script>
    /* ═══ Timeline (ms) — tune everything here ═══════════ */
    const T = {
      waveFadeIn:   400,    // wave letters fade in
      toOlive:      2600,   // bg starts tweening to olive, wave fades
      sunStart:     3100,   // sun ray-reveal begins
      sunReveal:    1300,   // duration of ray reveal
      windows:      4500,   // retro windows start their native reveal
      toPaper:      5600,   // bg fades to white, big sun fades
      sunFadeOut:   600,
    }

    const WAVE = {
      text: 'ML', columns: 24, rows: 12,
      amplitude: 40, frequency: 2,
      colSpacing: 28, rowSpacing: 32,
      fontSize: 16, color: '#F7F5F0', animSpeed: 2,
    }

    const SUN = {
      text: 'ML', rays: 8,
      innerRadius: 60, rayLength: 180,
      fontSize: 18, letterSpacing: 24, color: '#141414',
    }

    /* ═══ Canvas setup ═══════════════════════════════════ */
    const canvas = document.getElementById('ascii')
    const ctx = canvas.getContext('2d')
    const dpr = Math.min(window.devicePixelRatio || 1, 2)

    const waveW = WAVE.columns * WAVE.colSpacing + WAVE.fontSize
    const waveH = WAVE.rows * WAVE.rowSpacing + WAVE.amplitude * 2 + WAVE.fontSize * 2
    const sunSize = (SUN.innerRadius + SUN.rayLength) * 2 + SUN.fontSize * 2
    const W = Math.max(waveW, sunSize)
    const H = Math.max(waveH, sunSize)
    canvas.width = W * dpr
    canvas.height = H * dpr
    canvas.style.width = W + 'px'
    canvas.style.height = H + 'px'
    ctx.scale(dpr, dpr)

    /* Wave letters */
    const waveLetters = []
    {
      const chars = WAVE.text
      let i = 0
      const xOff = (W - waveW) / 2
      for (let row = 0; row < WAVE.rows; row++) {
        const rowOffset = (row - (WAVE.rows - 1) / 2) * WAVE.rowSpacing
        const phaseOffset = (row / WAVE.rows) * Math.PI * 2
        for (let col = 0; col < WAVE.columns; col++) {
          const x = xOff + col * WAVE.colSpacing + WAVE.colSpacing / 2
          const waveY = Math.sin((col / WAVE.columns) * Math.PI * 2 * WAVE.frequency + phaseOffset) * WAVE.amplitude
          waveLetters.push({
            x, baseY: H / 2 + rowOffset + waveY,
            phase: (col / WAVE.columns) * Math.PI * 2 * WAVE.frequency,
            char: chars[i % chars.length],
          })
          i++
        }
      }
    }

    /* Sun letters */
    const sunLetters = []
    let sunMaxStep = 0
    {
      const chars = SUN.text
      const stepsOnRay = Math.floor(SUN.rayLength / SUN.letterSpacing)
      let i = 0
      for (let ray = 0; ray < SUN.rays; ray++) {
        const angle = (ray / SUN.rays) * Math.PI * 2 - Math.PI / 2
        for (let step = 0; step <= stepsOnRay; step++) {
          const dist = SUN.innerRadius + step * SUN.letterSpacing
          sunLetters.push({
            x: W / 2 + Math.cos(angle) * dist,
            y: H / 2 + Math.sin(angle) * dist,
            step, char: chars[i % chars.length],
          })
          sunMaxStep = Math.max(sunMaxStep, step)
          i++
        }
      }
    }

    /* Mini sun (loops forever in its window) */
    const mini = document.getElementById('mini-sun')
    const mctx = mini.getContext('2d')
    const MINI_PX = 140
    const MINI_SCALE = MINI_PX / sunSize
    mini.width = MINI_PX * dpr
    mini.height = MINI_PX * dpr
    mini.style.width = MINI_PX + 'px'
    mini.style.height = MINI_PX + 'px'
    mctx.scale(dpr * MINI_SCALE, dpr * MINI_SCALE)

    /* ═══ Draw helpers ═══════════════════════════════════ */
    function drawWave(elapsed, alpha) {
      ctx.font = `${WAVE.fontSize}px 'GT Mechanik Mono', monospace`
      ctx.fillStyle = WAVE.color
      ctx.textAlign = 'center'
      ctx.textBaseline = 'middle'
      const animAmp = WAVE.amplitude * 0.4
      const frac = ((elapsed / 1000) % WAVE.animSpeed) / WAVE.animSpeed
      ctx.globalAlpha = alpha
      for (const L of waveLetters) {
        const dy = Math.sin(L.phase + frac * Math.PI * 2) * animAmp
        ctx.fillText(L.char, L.x, L.baseY + dy)
      }
      ctx.globalAlpha = 1
    }

    function sunOpacity(step, t, revealMs) {
      const turnOn = (step / Math.max(1, sunMaxStep)) * revealMs * 0.9
      if (t < turnOn) return 0
      return Math.min(1, (t - turnOn) / 180)
    }

    function drawSun(t, globalAlpha) {
      ctx.font = `${SUN.fontSize}px 'GT Mechanik Mono', monospace`
      ctx.fillStyle = SUN.color
      ctx.textAlign = 'center'
      ctx.textBaseline = 'middle'
      for (const L of sunLetters) {
        const o = sunOpacity(L.step, t, T.sunReveal) * globalAlpha
        if (o <= 0) continue
        ctx.globalAlpha = o
        ctx.fillText(L.char, L.x, L.y)
      }
      ctx.globalAlpha = 1
    }

    /* Mini sun: cyclic reveal like the original snippet */
    const MINI_CYCLE = 2500
    function drawMiniSun(elapsed) {
      const t = elapsed % MINI_CYCLE
      const revealMs = MINI_CYCLE * 0.65
      const holdEnd = revealMs + MINI_CYCLE * 0.15
      mctx.clearRect(0, 0, sunSize, sunSize)
      mctx.font = `${SUN.fontSize}px 'GT Mechanik Mono', monospace`
      mctx.fillStyle = SUN.color
      mctx.textAlign = 'center'
      mctx.textBaseline = 'middle'
      for (const L of sunLetters) {
        const turnOn = (L.step / Math.max(1, sunMaxStep)) * revealMs
        let o
        if (t < turnOn) o = 0
        else if (t < holdEnd) o = 1
        else o = Math.max(0, 1 - (t - holdEnd) / (MINI_CYCLE - holdEnd))
        if (o <= 0) continue
        mctx.globalAlpha = o
        mctx.fillText(L.char, L.x, L.y)
      }
      mctx.globalAlpha = 1
    }

    /* ═══ Retro windows — behavior lifted from retro-windows.js,
       reveal() triggered by the intro timeline instead of load ═══ */
    const section = document.getElementById('retro-windows')
    const retroStage = document.getElementById('retro-stage')
    const windows = [].slice.call(section.querySelectorAll('[data-window]'))
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches
    const mqMobile = window.matchMedia('(max-width: 800px)')

    /* Rich typewriter: wrap every char in a span (keeps the accent
       <span class="m"> coloring), then reveal chars one by one. */
    const bio = section.querySelector('[data-type-rich]')
    ;(function wrapChars(root) {
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT)
      const textNodes = []
      while (walker.nextNode()) textNodes.push(walker.currentNode)
      textNodes.forEach(node => {
        const frag = document.createDocumentFragment()
        for (const ch of node.textContent) {
          const s = document.createElement('span')
          s.className = 'ch'
          s.textContent = ch
          frag.appendChild(s)
        }
        node.parentNode.replaceChild(frag, node)
      })
    })(bio)
    const bioChars = [].slice.call(bio.querySelectorAll('.ch'))

    function typeBio(speed) {
      let i = 0
      bio.classList.add('retro-caret')
      ;(function step() {
        if (i < bioChars.length) {
          bioChars[i].style.visibility = 'visible'
          i++
          setTimeout(step, speed)
        } else {
          bio.classList.remove('retro-caret')
        }
      })()
    }

    function finishBio() {
      bioChars.forEach(c => { c.style.visibility = 'visible' })
      bio.classList.remove('retro-caret')
    }

    /* ── Name ticker: type → hold a beat → scroll off → repeat ── */
    const NAME = {
      typeMs:   38,     // per character
      holdMs:   1200,   // pause once fully typed
      scrollMs: 850,    // slide-out duration
      gapMs:    350,    // blank pause before retyping
    }
    const nameTrack = document.getElementById('name-track')
    const NAME_TEXT = nameTrack.textContent
    nameTrack.textContent = ''
    let nameTimers = []
    let nameRunning = false

    function nameSchedule(ms, fn) { nameTimers.push(setTimeout(fn, ms)) }

    function stopNameLoop() {
      nameTimers.forEach(clearTimeout)
      nameTimers = []
      nameRunning = false
      nameTrack.style.transition = 'none'
      nameTrack.style.transform = 'translateX(0)'
      nameTrack.textContent = ''
      nameTrack.classList.remove('retro-caret')
    }

    function startNameLoop() {
      if (nameRunning) return
      nameRunning = true
      if (reduce) { nameTrack.textContent = NAME_TEXT; return }
      ;(function cycle() {
        nameTrack.style.transition = 'none'
        nameTrack.style.transform = 'translateX(0)'
        nameTrack.textContent = ''
        nameTrack.classList.add('retro-caret')
        let i = 0
        ;(function step() {
          nameTrack.textContent = NAME_TEXT.slice(0, i)
          if (i < NAME_TEXT.length) {
            i++
            nameSchedule(NAME.typeMs, step)
          } else {
            nameTrack.classList.remove('retro-caret')
            nameSchedule(NAME.holdMs, () => {
              nameTrack.style.transition = `transform ${NAME.scrollMs}ms cubic-bezier(0.5, 0, 0.9, 0.6)`
              nameTrack.style.transform = 'translateX(calc(-100% - 48px))'
              nameSchedule(NAME.scrollMs + NAME.gapMs, cycle)
            })
          }
        })()
      })()
    }

    /* Close buttons */
    ;[].slice.call(section.querySelectorAll('.retro-close')).forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation()
        const win = btn.closest('[data-window]')
        if (win) win.style.display = 'none'
      })
      btn.addEventListener('pointerdown', e => e.stopPropagation())
    })

    /* Dragging (clamped to the stage) */
    let topZ = 10
    function initDrag(win) {
      const handle = win.querySelector('[data-drag-handle]')
      if (!handle) return
      handle.addEventListener('pointerdown', e => {
        if (mqMobile.matches) return
        if (e.button !== undefined && e.button !== 0) return
        e.preventDefault()
        e.stopPropagation()                      // don't trigger intro skip
        const stageRect = retroStage.getBoundingClientRect()
        const winRect = win.getBoundingClientRect()
        const offsetX = e.clientX - winRect.left
        const offsetY = e.clientY - winRect.top
        win.style.left = (winRect.left - stageRect.left) + 'px'
        win.style.top = (winRect.top - stageRect.top) + 'px'
        win.style.zIndex = ++topZ
        win.classList.add('is-dragging')
        handle.setPointerCapture(e.pointerId)
        function onMove(ev) {
          const sRect = retroStage.getBoundingClientRect()
          const x = ev.clientX - sRect.left - offsetX
          const y = ev.clientY - sRect.top - offsetY
          const maxX = retroStage.clientWidth - win.offsetWidth
          const maxY = retroStage.clientHeight - win.offsetHeight
          win.style.left = Math.max(0, Math.min(x, maxX)) + 'px'
          win.style.top = Math.max(0, Math.min(y, maxY)) + 'px'
        }
        function onUp() {
          win.classList.remove('is-dragging')
          try { handle.releasePointerCapture(e.pointerId) } catch (err) {}
          handle.removeEventListener('pointermove', onMove)
          handle.removeEventListener('pointerup', onUp)
          handle.removeEventListener('pointercancel', onUp)
        }
        handle.addEventListener('pointermove', onMove)
        handle.addEventListener('pointerup', onUp)
        handle.addEventListener('pointercancel', onUp)
      })
    }
    windows.forEach(initDrag)

    /* Fit the fixed-size cluster to the viewport (from retro-windows.js) */
    const STAGE_W = 820
    function fitStage() {
      const avail = Math.min(window.innerWidth - 32, STAGE_W)
      const s = Math.min(1, avail / STAGE_W)
      retroStage.style.transformOrigin = 'center center'
      retroStage.style.transform = s < 1 ? 'scale(' + s + ')' : 'none'
    }
    fitStage()
    window.addEventListener('resize', fitStage)

    /* Load-in: stagger windows, then type (same rhythm as live site) */
    let revealed = false
    function reveal() {
      if (revealed) return
      revealed = true
      windows.forEach((win, idx) => {
        if (reduce) {
          win.classList.add('is-visible')
          finishBio()
          startNameLoop()
          return
        }
        setTimeout(() => {
          win.classList.add('is-visible')
          if (win.querySelector('[data-type-rich]')) {
            setTimeout(() => typeBio(16), 240)
          }
          if (win.querySelector('#name-track')) {
            setTimeout(startNameLoop, 240)
          }
        }, idx * 130)
      })
    }

    /* ═══ Master timeline ════════════════════════════════ */
    const stage = document.getElementById('stage')
    const timers = []
    let start = null
    let finished = false
    let rafId = null

    function schedule(at, fn) { timers.push(setTimeout(fn, at)) }

    function run() {
      finished = false
      start = null
      revealed = false
      timers.forEach(clearTimeout)
      timers.length = 0
      if (rafId) cancelAnimationFrame(rafId)
      stage.classList.remove('olive', 'paper')
      canvas.classList.remove('gone')
      windows.forEach(w => { w.classList.remove('is-visible'); w.style.display = '' })
      bioChars.forEach(c => { c.style.visibility = '' })
      stopNameLoop()

      schedule(T.toOlive, () => stage.classList.add('olive'))
      schedule(T.windows, reveal)
      schedule(T.toPaper, () => {
        stage.classList.add('paper')
        canvas.classList.add('gone')
      })
      schedule(T.toPaper + 900, () => { finished = true })

      rafId = requestAnimationFrame(frame)
    }

    function frame(ts) {
      if (!start) start = ts
      const t = ts - start
      ctx.clearRect(0, 0, W, H)

      if (t < T.toOlive + 400) {
        const fadeIn = Math.min(1, t / T.waveFadeIn)
        const fadeOut = t > T.toOlive ? Math.max(0, 1 - (t - T.toOlive) / 400) : 1
        drawWave(t, fadeIn * fadeOut)
      }

      if (t >= T.sunStart) {
        let g = 1
        if (t > T.toPaper) g = Math.max(0, 1 - (t - T.toPaper) / T.sunFadeOut)
        if (g > 0) drawSun(t - T.sunStart, g)
      }

      if (t >= T.windows) {
        drawMiniSun(t - T.windows)
      }

      rafId = requestAnimationFrame(frame)
    }

    /* Skip to final state */
    function skip() {
      if (finished) return
      timers.forEach(clearTimeout)
      timers.length = 0
      stage.classList.add('olive', 'paper')
      canvas.classList.add('gone')
      revealed = true
      windows.forEach(w => w.classList.add('is-visible'))
      finishBio()
      startNameLoop()
      start = performance.now() - (T.toPaper + T.sunFadeOut + 100)
      finished = true
    }

    document.addEventListener('click', e => {
      // clicks inside windows (drag, close) shouldn't skip once they're up
      if (revealed && e.target.closest('.retro-window')) return
      skip()
    })
    document.addEventListener('keydown', e => {
      if (e.key === 'r' || e.key === 'R') run()
    })

    if (reduce) {
      run(); skip()
    } else {
      document.fonts.ready.then(run)
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/Icons/ML-Logo.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Art Icon Set — ML Howell</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=Inter+Display:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/global.css?v=10">
  <link rel="stylesheet" href="/projects/project.css?v=5">
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

  <div class="page">
    <header class="site-nav">
      <a href="/" class="site-name">ML Howell</a>
      <nav class="nav-links">
        <a href="/#work">Work</a>
        <a href="/about/">About</a>
        <a href="/experiments/">Experiments</a>
      </nav>
    </header>

    <div class="img-full">
      <img src="/experiments/images/Icon_set.png" alt="Pixel art icon set">

    <footer></footer>
  </div>

  <script src="/footer.js?v=5"></script>
  <script src="/settings-widget.js?v=51"></script>
  <script>
    (function () {
      try {
        const saved = sessionStorage.getItem('ml-settings');
        if (!saved) return;
        const s = JSON.parse(saved);
        const root = document.documentElement;
        const _mob = window.innerWidth <= 800;
        Object.entries(s).forEach(([k, v]) => { if (_mob && k === '--pad-page-h') return; root.style.setProperty(k, v); });
      } catch (e) {}
    })();
  </script>

</body>
</html>

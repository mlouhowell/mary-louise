<body>

  <div class="page">
    <header class="site-nav">
      <a href="/" class="site-name">ML Howell</a>

        <a href="/#work">Work</a>
        <a href="/about/">About</a>

    </header>

    <h1 class="page-title">theSkimm Illustrations</h1>

    <div class="hero-image">
      <span class="hero-image-placeholder">Hero image</span>
    </div>

    <div class="section">

    </div>

    <div class="img-row col-2">
      <div class="img-row-item"><span class="img-placeholder">Image</span></div>

  <script src="/footer.js?v=2"></script>
  <script src="/settings-widget.js?v=51"></script>
  <script>
    (function () {
      try {
        const saved = sessionStorage.getItem('ml-settings');
        if (!saved) return;
        const s = JSON.parse(saved);
        const root = document.documentElement;
        const _mob = window.innerWidth <= 800;
        Object.entries(s).forEach(([k, v]) => { if (_mob && k === '--pad-page-h') return; root.style.setProperty(k, v); });
      } catch (e) {}
    })();
  </script>

</body>
